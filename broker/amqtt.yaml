# Локальний брокер на Python (amqtt) - запасний варіант, не потребує sudo.
# Запуск:  .venv/bin/amqtt -c broker/amqtt.yaml
---
listeners:
  default:
    type: tcp
    bind: 127.0.0.1:1883
plugins:
  amqtt.plugins.authentication.AnonymousAuthPlugin:
    allow_anonymous: true
  amqtt.plugins.sys.broker.BrokerSysPlugin:
    sys_interval: 10
