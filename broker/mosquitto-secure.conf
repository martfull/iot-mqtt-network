# Приватний брокер Mosquitto - захищений режим:
#   * 1883 - тільки localhost, з паролем
#   * 8883 - TLS (шифрування) + пароль, доступний з мережі
#   * ACL - кожен вузол пише лише у свої топіки
# Підготовка:  bash broker/setup_secure.sh
# Запуск:      mosquitto -c broker/mosquitto-secure.conf -v
# per_listener_settings НЕ вмикати: у 2.0.18 ламає черги офлайн-клієнтів
allow_anonymous false
password_file broker/secure/passwd
acl_file broker/acl

listener 1883 127.0.0.1

listener 8883
cafile   broker/secure/ca.crt
certfile broker/secure/server.crt
keyfile  broker/secure/server.key
tls_version tlsv1.2

persistence true
persistence_location ./data/mosquitto/
max_queued_messages 1000
