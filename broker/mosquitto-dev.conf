# Приватний брокер Mosquitto - режим розробки (без автентифікації, тільки localhost)
# Запуск:  mosquitto -c broker/mosquitto-dev.conf -v

listener 1883 127.0.0.1
allow_anonymous true

persistence true
persistence_location ./data/mosquitto/
# скільки QoS1/2-повідомлень тримати для офлайн-клієнта з persistent session
max_queued_messages 1000
